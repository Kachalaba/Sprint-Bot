  help: "<b>Як користуватися Sprint Bot</b>\n\n<b>Введення результатів</b>\n• /add_wizard — майстер з перевірками сплітів\n• /results — швидке внесення часу та дистанції\n\n<b>Історія</b>\n• /progress — останні старти й тренування\n• /history — архів команди (для тренерів)\n\n<b>Порівняння</b>\n• /compare — порівняння спортсменів\n• /team_progress — команда проти команди\n\n<b>Рекорди</b>\n• /best — особисті рекорди\n• /show_sob — Speed-on-Board\n\n<b>Лідерборд</b>\n• /leaders — топ тижня\n• /my_progress_week — мій прогрес за тиждень\n\n<b>Експорт</b>\n• /export — CSV з результатами\n• /export_pb — персональні рекорди\n• /export_analysis — аналітика сплітів"
  unknown_command: "Команду не розпізнано. Будь ласка, скористайтеся меню."
  cmd:
    start: "Запустити бота"
    help: "Допомога"
    menu: "Меню"
